# Crisper dev stack. Two services and a test runner.
#
# The generated stack also had Mailpit and MinIO; the MVP sends no email and
# keeps receipt photos on the local disk, so both were removed rather than left
# running as decoration. Add them back the day there is a reason.
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    environment:
      RAILS_ENV: development
      DATABASE_PATH: /data/development.sqlite3
      JWT_SECRET: c893be853e22bc9c1eb0128d0a9a1f82ca090f6198cec2f3852287af69a33a47
      SECRET_KEY_BASE: 2f4c0e0b6f9a4d1c8e7b3a5d9f1c2e4a6b8d0f2a4c6e8b0d2f4a6c8e0b2d4f6a
      CORS_ORIGINS: "http://localhost:4200"
      RAILS_LOG_TO_STDOUT: "true"
      APP_HOST: localhost
      APP_PORT: 3001
      APP_FRONTEND_URL: http://localhost:4200
      ACTIVE_STORAGE_SERVICE: local
      # Leave OPENAI_API_KEY unset and the app runs against Ai::Stub: fully
      # clickable, zero spend. Set it (or put it in .env) to go live.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODE: ${AI_MODE:-auto}
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - sqlite_dev_data:/data
      - /app/frontend
    stdin_open: true
    tty: true
    command: >
      bash -c "
        bundle install &&
        bundle exec rails db:prepare &&
        bundle exec rails db:seed &&
        bundle exec puma -C config/puma.rb
      "

  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: test
      DATABASE_PATH: storage/test.sqlite3
      JWT_SECRET: test-jwt-secret
      SECRET_KEY_BASE: test-secret-key-base-000000000000000000000000000000000000000000000000
      AI_MODE: stub
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
      - /app/frontend
    command: >
      bash -c "
        bundle install &&
        bin/rails db:test:prepare &&
        bundle exec rspec
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  bundle_cache:
  sqlite_dev_data:
  frontend_node_modules:
