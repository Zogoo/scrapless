en:
  auth:
    no_fridge: "No fridge yet — start one and we'll remember it."
  record:
    not_found: "We couldn't find that."
  capture:
    unreadable: "That one was hard to read. Want to try again, or just tell us the fresh stuff?"
    partial_parse: "We added what we recognised. Couldn't make sense of: %{list}"
    ai_unavailable: "Photo reading is off right now. You can still type or say what you got — that always works."
    too_many: "That is a lot of photos in one go. Give it an hour and try again."
  # Copy law (doc 4 §4.13): never "expired", never a precise date we did not read
  # off a label, never a guilt frame.
  freshness:
    fine:
      one: "fine for about another day"
      other: "fine for about %{count} more days"
    aging:
      one: "about a day left"
      other: "about %{count} days left"
    soon:
      one: "worth using tomorrow"
      other: "use in the next %{count} days"
    today: "worth using today"
    check_it: "%{name} — worth checking"
    probably_gone: "probably gone by now"
