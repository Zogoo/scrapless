    no_fridge: "No fridge yet — start one and we'll remember it."
    too_many_fridges: "That is a lot of new fridges. Try again in an hour."
    unknown_kitchen: "That link doesn't open a kitchen."
    too_many_joins: "That is a lot of tries. Give it an hour."
  record:
    invalid: "That didn't look right. Check it and try again."
    not_found: "We couldn't find that."
    conflict: "Someone else just changed that. Here's the latest."
  items:
    unknown_outcome: "That isn't something we can do with food."
    not_undoable: "That one can't be undone any more."
  capture:
    rejected:
      no_image: "There was no photo in that."
      no_audio: "We didn't hear anything."
      no_text: "Type what you got first."
      too_large: "That file is too big. Try a smaller photo."
      too_long: "That's a lot at once. Try a shorter list."
      audio_too_large: "That recording is too long. Try a shorter one."
    unreadable: "That one was hard to read. Want to try again, or just tell us the fresh stuff?"
    partial_parse: "We added what we recognised. Couldn't make sense of: %{list}"
    ai_unavailable: "Photo reading is off right now. You can still type or say what you got — that always works."
    too_many: "That is a lot of photos in one go. Give it an hour and try again."
