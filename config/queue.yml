# Push delivery is a handful of HTTPS calls, so two threads are plenty, and few
# writers suit SQLite. Puma runs this in async mode (one process, see
# config/puma.rb), which ignores `processes`.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 2
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
