@if (ready()) {
  <main>
    <router-outlet />
  </main>

  @if (showTabs()) {
    <!-- Four tabs, maximum. Today is the app; the rest is support. -->
    <nav class="tabs" [attr.aria-label]="'nav.main' | translate">
      <a routerLink="/today" routerLinkActive="active">
        <span aria-hidden="true">🏠</span>
        <small>{{ 'nav.today' | translate }}</small>
      </a>
      <a routerLink="/kitchen" routerLinkActive="active">
        <span aria-hidden="true">🧊</span>
        <small>{{ 'nav.kitchen' | translate }}</small>
      </a>
      <a routerLink="/memo" routerLinkActive="active">
        <span aria-hidden="true">🛒</span>
        <small>{{ 'nav.memo' | translate }}</small>
      </a>
      <a routerLink="/settings" routerLinkActive="active">
        <span aria-hidden="true">⚙️</span>
        <small>{{ 'nav.settings' | translate }}</small>
      </a>
    </nav>
  }
} @else {
  <p class="loading">{{ 'common.loading' | translate }}</p>
}
