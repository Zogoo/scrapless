<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>restlos</title>
    <base href="/" />
    <!-- viewport-fit=cover so the tab bar can clear the iOS home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Kochen. Retten. Genießen." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1B5E20" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1A1C19" media="(prefers-color-scheme: dark)" />

    <!-- iOS ignores the manifest for standalone mode; these are the only way. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="restlos" />
    <link
      rel="apple-touch-icon"
      href="/branding/app_icon_light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="apple-touch-icon"
      href="/branding/app_icon_dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/branding/app_icon_light.png" />

    <link
      rel="icon"
      type="image/png"
      href="/branding/app_icon_light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/branding/app_icon_dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" type="image/png" href="/branding/app_icon_light.png" />
  </head>
  <body>
    <app-root></app-root>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Not fatal: without it the app still works, just not offline.
          });
        });
      }
    </script>
  </body>
</html>
