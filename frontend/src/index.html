<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crisper — what needs eating</title>
    <base href="/" />
    <!-- viewport-fit=cover so the tab bar can clear the iOS home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Point the camera at your receipt. We tell you what to eat first."
    />

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2e7d32" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />

    <!-- iOS ignores the manifest for standalone mode; these are the only way. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Crisper" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  </head>
  <body>
    <app-root></app-root>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            // Not fatal: without it the app still works, just not offline.
          });
        });
      }
    </script>
  </body>
</html>
